<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Text to Video — Aether AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html">←</a>
    <h1>🎬 Text to Video</h1>
    <span class="spacer"></span>
  </div>
  <div class="chat-wrap">
    <div class="gen-form">
      <textarea id="prompt" placeholder="Deskripsikan video pendek yang kamu mau (bahasa Inggris hasil lebih bagus)..."></textarea>
      <button id="go">🎬 Generate Video</button>
      <p style="color:var(--muted);font-size:12px;margin-top:10px;">⚠️ Generate video butuh waktu lama (1-3 menit) dan kadang model perlu warm-up dulu. Kalau gagal, coba lagi setelah 30 detik.</p>
    </div>
    <div class="gen-result" id="result"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const { apiVideo } = window.AI;
const goBtn = document.getElementById("go");
const result = document.getElementById("result");
goBtn.onclick = async () => {
  const p = document.getElementById("prompt").value.trim();
  if (!p) return;
  goBtn.disabled = true; goBtn.textContent = "⏳ Generating... (sabar ya)";
  result.innerHTML = '<div style="color:var(--muted);font-size:13px;">⏳ Tunggu 1-3 menit...</div>';
  try {
    const url = await apiVideo(p);
    result.innerHTML = "";
    const v = document.createElement("video"); v.src = url; v.controls = true; v.autoplay = true; v.loop = true; v.muted = true;
    const a = document.createElement("a"); a.href = url; a.download = "ai-video.mp4"; a.textContent = "⬇️ Download";
    a.style.cssText = "display:inline-block;margin-top:10px;color:var(--accent);text-decoration:none;";
    result.appendChild(v); result.appendChild(a);
  } catch (e) {
    result.innerHTML = "";
    const d = document.createElement("div"); d.className = "error"; d.textContent = "❌ " + e.message;
    result.appendChild(d);
  } finally {
    goBtn.disabled = false; goBtn.textContent = "🎬 Generate Video";
  }
};
</script>
</body>
</html>
