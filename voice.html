<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Mode — Aether AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="index.html">←</a>
    <h1>🎙️ Voice Mode</h1>
    <span class="spacer"></span>
  </div>
  <div class="voice-stage">
    <div class="avatar-wrap">
      <div class="avatar-glow" id="glow"></div>
      <img class="avatar-img" id="avatar" src="assets/avatar_idle.png" alt="AI Avatar" />
    </div>
    <div class="voice-status" id="status">Tap mic untuk mulai ngobrol</div>
    <div class="voice-controls">
      <button class="btn-mic" id="mic">🎤</button>
      <button class="btn-secondary" id="stop">⏹ Stop</button>
    </div>
    <p style="color: var(--muted); font-size: 12px; max-width: 400px; text-align: center; margin: 0;">
      Pakai Web Speech API (Chrome/Edge terbaik). Browser akan minta izin mic.
    </p>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const { apiChat } = window.AI;
const avatar = document.getElementById("avatar");
const glow = document.getElementById("glow");
const statusEl = document.getElementById("status");
const micBtn = document.getElementById("mic");
const stopBtn = document.getElementById("stop");

const IDLE = "assets/avatar_idle.png";
const TALK = "assets/avatar_talking.png";

let history = [{ role: "system", content: "You are Aether, a warm, playful AI companion. Reply in the user's language. Keep replies short (1-3 sentences) since this is a voice conversation." }];
let mouthInterval = null;
let recognition = null;
let listening = false;

function setStatus(s) { statusEl.innerHTML = s; }
function setMode(mode) {
  glow.className = "avatar-glow" + (mode === "speak" ? " speaking" : mode === "listen" ? " listening" : "");
}

function startMouthAnim() {
  let toggle = false;
  mouthInterval = setInterval(() => {
    toggle = !toggle;
    avatar.src = toggle ? TALK : IDLE;
  }, 180);
}
function stopMouthAnim() {
  if (mouthInterval) clearInterval(mouthInterval);
  mouthInterval = null;
  avatar.src = IDLE;
}

// Speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  setStatus("⚠️ Browser tidak support Web Speech API. Pakai Chrome/Edge.");
  micBtn.disabled = true;
}

function startListening() {
  if (!SR || listening) return;
  recognition = new SR();
  recognition.lang = "id-ID";
  recognition.continuous = false;
  recognition.interimResults = true;
  listening = true;
  micBtn.classList.add("recording");
  setMode("listen");
  setStatus("<strong>Mendengarkan...</strong>");

  let finalTranscript = "";
  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += t;
      else interim += t;
    }
    setStatus(`<strong>Kamu:</strong> ${finalTranscript || interim}`);
  };
  recognition.onerror = (e) => {
    setStatus("❌ Mic error: " + e.error);
    stopListening();
  };
  recognition.onend = async () => {
    listening = false;
    micBtn.classList.remove("recording");
    setMode("idle");
    if (finalTranscript.trim()) {
      await respond(finalTranscript.trim());
    } else {
      setStatus("Tidak ada suara terdeteksi. Tap mic lagi.");
    }
  };
  recognition.start();
}

function stopListening() {
  if (recognition) try { recognition.stop(); } catch {}
  listening = false;
  micBtn.classList.remove("recording");
  setMode("idle");
}

micBtn.onclick = () => listening ? stopListening() : startListening();
stopBtn.onclick = () => { stopListening(); speechSynthesis.cancel(); stopMouthAnim(); setStatus("Stopped."); };

async function respond(text) {
  history.push({ role: "user", content: text });
  setStatus("<strong>Aether</strong> lagi mikir...");
  try {
    const res = await apiChat({ messages: history, model: window.AI_CONFIG.CHAT_MODELS[2].id });
    const reply = res.content;
    history.push({ role: "assistant", content: reply });
    if (history.length > 20) history = [history[0], ...history.slice(-18)];
    setStatus(`<strong>Aether:</strong> ${reply}`);
    speak(reply);
  } catch (e) {
    setStatus("❌ " + e.message);
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  // Pick Indonesian voice if available
  const voices = speechSynthesis.getVoices();
  const id = voices.find(v => v.lang?.startsWith("id"));
  if (id) u.voice = id;
  u.rate = 1.05; u.pitch = 1.1;
  u.onstart = () => { setMode("speak"); startMouthAnim(); };
  u.onend = () => { setMode("idle"); stopMouthAnim(); };
  speechSynthesis.speak(u);
}

// Warm up voices list
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
